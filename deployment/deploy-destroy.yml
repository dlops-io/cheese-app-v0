# Tear down what deploy-create-instance.yml built.
# Run: ansible-playbook deploy-destroy.yml -i inventory.yml -e confirm=DESTROY
# Add -e delete_disk=yes to also delete the persistent disk (your /persistent data).
- name: Destroy App Application Machine
  hosts: localhost
  gather_facts: false
  environment:
    GCP_AUTH_KIND: "{{gcp_auth_kind}}"
    GCP_SERVICE_ACCOUNT_FILE: "{{ gcp_service_account_file }}"
    GCP_SCOPES: "{{gcp_scopes}}"

  vars:
    delete_disk: "no"
    delete_ip: "no"

  tasks:
    - name: "Refuse to run without explicit confirmation"
      assert:
        that: confirm | default('') == 'DESTROY'
        fail_msg: >-
          This deletes instance {{ machine_instance_name }} in {{ gcp_project }}/{{ gcp_zone }}.
          Re-run with -e confirm=DESTROY

    - name: Delete instance
      gcp_compute_instance:
        name: "{{ machine_instance_name }}"
        zone: "{{ gcp_zone }}"
        project: "{{ gcp_project }}"
        auth_kind: "{{gcp_auth_kind}}"
        service_account_file: "{{ gcp_service_account_file }}"
        scopes: "{{gcp_scopes}}"
        state: absent

    # Disk has auto_delete: false, so it survives the instance unless removed here.
    - name: Delete persistent disk
      gcp_compute_disk:
        name: "{{ persistent_disk_name }}"
        zone: "{{ gcp_zone }}"
        project: "{{ gcp_project }}"
        auth_kind: "{{gcp_auth_kind}}"
        service_account_file: "{{ gcp_service_account_file }}"
        scopes: "{{gcp_scopes}}"
        state: absent
      when: delete_disk | bool

    - name: "Persistent disk kept"
      debug:
        msg: "Disk {{ persistent_disk_name }} kept. Add -e delete_disk=yes to remove it."
      when: not (delete_disk | bool)

    # Releasing the IP means a new one (and a new DNS record) on the next deploy.
    # GCP bills reserved-but-unattached addresses, so don't sit on it forever.
    - name: Delete static external IP
      gcp_compute_address:
        name: "{{ machine_instance_name }}-ip"
        region: "{{ gcp_region }}"
        project: "{{ gcp_project }}"
        auth_kind: "{{gcp_auth_kind}}"
        service_account_file: "{{ gcp_service_account_file }}"
        scopes: "{{gcp_scopes}}"
        state: absent
      when: delete_ip | bool

    - name: "Static IP kept"
      debug:
        msg: >-
          IP {{ machine_instance_name }}-ip kept and still billed while unattached.
          Add -e delete_ip=yes to release it.
      when: not (delete_ip | bool)
