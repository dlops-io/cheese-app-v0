- name: Create App Application Machine
  hosts: localhost
  environment:
    GCP_AUTH_KIND: "{{gcp_auth_kind}}"
    GCP_SERVICE_ACCOUNT_FILE: "{{ gcp_service_account_file }}"
    GCP_SCOPES: "{{gcp_scopes}}"

  tasks:
    - name: "Create http/https firewall rules"
      gcp_compute_firewall:
        auth_kind: "{{gcp_auth_kind}}"
        service_account_file: "{{ gcp_service_account_file }}"
        scopes: "{{gcp_scopes}}"
        project: "{{ gcp_project }}"
        name: "{{ item.name }}"
        network:
          selfLink: "global/networks/default"
        allowed:
          - ip_protocol: "tcp"
            ports: ["{{ item.port }}"]
        source_ranges: ["0.0.0.0/0"]
        target_tags: ["http-server"]
        state: "present"
      loop:
        - { name: "default-allow-http", port: "80" }
        - { name: "default-allow-https", port: "443" }

    # Reserve a static IP so the DNS record survives instance stop/start
    - name: Create static external IP
      gcp_compute_address:
        auth_kind: "{{gcp_auth_kind}}"
        service_account_file: "{{ gcp_service_account_file }}"
        scopes: "{{gcp_scopes}}"
        region: "{{ gcp_region }}"
        project: "{{ gcp_project }}"
        name: "{{ machine_instance_name }}-ip"
        state: "present"
      register: address

    # Create Persistent Disk
    - name: Create Compute disk
      gcp_compute_disk:
        auth_kind: "{{gcp_auth_kind}}"
        service_account_file: "{{ gcp_service_account_file }}"
        scopes: "{{gcp_scopes}}"
        zone: "{{ gcp_zone }}"
        project: "{{ gcp_project }}"
        name: "{{ persistent_disk_name }}"
        size_gb: "{{ persistent_disk_size }}"
        state: "present"
      register: disk
    # Create Compute Instance
    - name: Create instance
      gcp_compute_instance:
        name: "{{ machine_instance_name }}"
        machine_type: "{{ machine_type }}"
        disks:
          - auto_delete: true
            boot: true
            initialize_params:
                source_image: "projects/debian-cloud/global/images/family/debian-13"
                disk_size_gb: "{{ machine_disk_size }}"
          - auto_delete: false
            boot: false
            source: "{{ disk }}"
        network_interfaces:
          - access_configs:
              - name: "External NAT"
                type: "ONE_TO_ONE_NAT"
                nat_ip: "{{ address }}"
        tags:
          items:
            - http-server
            - https-server
        zone: "{{ gcp_zone }}"
        project: "{{ gcp_project }}"
        state: present
      register: instance

    - name: Wait for SSH to come up
      wait_for: host={{ instance.networkInterfaces[0].accessConfigs[0].natIP }} port=22 delay=10 timeout=120

    - name: Add host to groupname
      add_host: hostname={{ instance.networkInterfaces[0].accessConfigs[0].natIP }} groupname=new_instances

    - name: "Static IP — put this in inventory.yml appserver.hosts and in the DNS A record"
      debug:
        msg: "{{ address.address }}"
